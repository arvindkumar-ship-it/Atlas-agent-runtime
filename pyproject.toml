[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-agent-runtime"
version = "1.0.0"
description = "Durable, evidence-backed software agent execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "httpx>=0.27,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "prometheus-client>=0.21,<1", "numpy>=1.26,<3",
  "opentelemetry-sdk>=1.27,<2", "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "pytest>=8.3,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1", "build>=1.2,<2"]
reference = ["torch>=2.4,<3"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
include = ["atlas*", "apps*", "benchmarks*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: needs ATLAS_TEST_DATABASE_URL", "docker: needs a Docker daemon", "model: needs a model server", "torch: needs PyTorch"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
