name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check atlas apps tests benchmarks scripts
      - run: ruff format --check atlas apps tests benchmarks scripts
      - run: docker build -f deploy/sandbox.Dockerfile -t atlas-sandbox:1.0 .
      - run: pytest -q
        env:
          ATLAS_TEST_DATABASE_URL: postgresql://atlas:ci-only-password@localhost:5432/atlas_test
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.lock
        working-directory: .
      - run: pip install --no-deps -e .
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pytest -q tests/test_reference.py
